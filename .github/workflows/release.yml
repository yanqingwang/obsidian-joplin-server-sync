name: Release

on:
  push:
    # Obsidian matches the release tag against manifest.json verbatim, so only
    # plain `x.y.z` tags are allowed; a `v`-prefixed tag fails the guard below.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Obsidian only accepts a release whose tag equals the manifest version,
      # with no `v` prefix.
      - name: Check tag matches manifest version
        run: |
          ver="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $ver"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
          make_latest: true
